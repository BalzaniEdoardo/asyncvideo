[build-system]
requires = ["setuptools", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncvideo"
# the version comes from the git tag, via setuptools_scm -- see [tool.setuptools_scm].
# tagging 0.1.0 is what makes the release 0.1.0; there is no version to bump here,
# and so no way for the two to disagree.
dynamic = ["version"]
description = "Async video reader with fast random frame access."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kushal Kolar" },
    { name = "Edoardo Balzani" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "av",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "nox",
    "ruff",
    "matplotlib",
]
# needed to run the examples and build the docs, not to use the package
docs = [
    "matplotlib",
    "fastplotlib[imgui]",
    "glfw",  # windowing backend fastplotlib renders into
    "pooch",  # downloads and hash-verifies the example clips
    "tqdm",  # download progress bar
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asyncvideo"]

[tool.setuptools_scm]
# Building from a directory with no git metadata -- an unpacked sdist, say -- cannot
# know the version, so fall back rather than failing the build. A release always
# builds from a tagged checkout, so this value should never reach PyPI.
fallback_version = "0.0.0"